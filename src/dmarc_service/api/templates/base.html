<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <title>{% block title %}dmarc-service{% endblock %}</title>
  <style>
    :root {
      color-scheme: light dark;
      /* spacing scale - every gap/padding below comes from this */
      --s1: .25rem; --s2: .5rem; --s3: .75rem; --s4: 1rem; --s5: 1.5rem; --s6: 2rem;
      --surface: #fcfcfb; --card: #ffffff; --border: #00000018; --hover: #00000008;
      --ink: #1c1c1a; --ink-2: #1c1c1aa8;
      --accent: #3056d3; --danger: #c22b2b;
      --radius: 10px;
    }
    @media (prefers-color-scheme: dark) {
      :root { --surface: #1a1a19; --card: #222221; --border: #ffffff1c; --hover: #ffffff0a;
              --ink: #f2f2ef; --ink-2: #f2f2efa0; --accent: #8fa8ff; --danger: #ff7b6e; }
    }
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; margin: 0; background: var(--surface);
           color: var(--ink); line-height: 1.5; }
    main { max-width: 78rem; margin: 0 auto; padding: var(--s5) var(--s5) 4rem; }

    h1 { font-size: 1.45rem; line-height: 1.25; margin: 0 0 var(--s2); }
    h1 .sub { font-size: 1rem; font-weight: 400; color: var(--ink-2); }
    h2 { font-size: 1.05rem; margin: 0 0 var(--s3); }
    p { margin: 0 0 var(--s3); }
    .section { margin-top: var(--s6); }
    .section > p:last-of-type { margin-bottom: var(--s3); }

    /* --- nav --- */
    nav { display: flex; align-items: center; gap: var(--s1); flex-wrap: wrap;
          padding: var(--s2) var(--s5); background: var(--card);
          border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 5; }
    nav .brand { font-weight: 700; margin-right: var(--s4); }
    nav a { text-decoration: none; color: var(--ink-2); padding: var(--s2) var(--s3);
            border-radius: 7px; font-size: .95rem; line-height: 1; }
    nav a:hover { color: var(--ink); background: var(--hover); }
    nav a.active { color: var(--ink); background: var(--border); font-weight: 600; }
    nav .spacer { flex: 1; }
    nav .who { color: var(--ink-2); font-size: .88rem; margin-right: var(--s3); }

    /* --- tables --- */
    .table-wrap { overflow-x: auto; background: var(--card);
                  border: 1px solid var(--border); border-radius: var(--radius); }
    table { border-collapse: collapse; width: 100%; }
    th, td { text-align: left; padding: var(--s3) var(--s4); border-bottom: 1px solid var(--border); }
    tr:last-child td { border-bottom: none; }
    th { font-weight: 600; font-size: .78rem; letter-spacing: .04em; text-transform: uppercase;
         color: var(--ink-2); white-space: nowrap; padding-bottom: var(--s2); }
    tbody tr:hover td { background: var(--hover); }
    td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
    td.actions, th.actions { text-align: right; white-space: nowrap; }
    td.nowrap, th.nowrap { white-space: nowrap; }
    td .sub { display: block; color: var(--ink-2); font-size: .85rem; margin-top: 2px; }
    /* long PTRs and DKIM domains must not stretch a column off-screen */
    .trunc { display: block; max-width: 17rem; overflow: hidden;
             text-overflow: ellipsis; white-space: nowrap; }

    /* --- text & status --- */
    .muted { color: var(--ink-2); font-size: .92rem; }
    .pill { border: 1px solid var(--border); border-radius: 999px;
            padding: var(--s1) var(--s3); font-size: .85rem; background: var(--card); }
    .ok { color: #0b7a0b; font-weight: 600; }
    .bad { color: var(--danger); font-weight: 600; }
    .warn { color: #b16f00; font-weight: 600; }
    @media (prefers-color-scheme: dark) { .ok { color: #4fc35c; } .warn { color: #f0b03f; } }
    .zero { opacity: .4; font-weight: 400; }
    tr.rec-bad td { background: #cc333312; }
    .error { color: var(--danger); margin-bottom: var(--s3); }

    a { color: var(--accent); }
    td a, .card a { text-decoration: none; }
    td a:hover { text-decoration: underline; }

    /* --- controls --- */
    form.inline { display: inline-block; }
    .row-actions { display: flex; gap: var(--s2); flex-wrap: wrap; margin-top: var(--s3); }
    input[type=text], input[type=password], input[type=email], input[type=file] {
      padding: var(--s2) var(--s3); border: 1px solid var(--border); border-radius: 7px;
      background: var(--card); color: inherit; font-size: .95rem; }
    input:focus-visible, button:focus-visible, a:focus-visible {
      outline: 2px solid var(--accent); outline-offset: 1px; }
    button { padding: var(--s2) var(--s4); border: 1px solid var(--border); border-radius: 7px;
             background: var(--card); color: inherit; cursor: pointer; font-size: .92rem;
             line-height: 1.2; white-space: nowrap; }
    button:hover:not(:disabled) { border-color: var(--ink-2); background: var(--hover); }
    button:disabled { opacity: .5; cursor: not-allowed; }
    button.danger { color: var(--danger); border-color: #c22b2b40; }
    button.danger:hover { border-color: var(--danger); }
    code { font-size: .85rem; background: var(--hover); padding: 2px var(--s1);
           border-radius: 4px; }
    code.rec { white-space: nowrap; }
    td.wrap code.rec { white-space: normal; overflow-wrap: anywhere; }

    /* --- cards & banners --- */
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(11rem, 1fr));
             gap: var(--s3); margin-bottom: var(--s5); }
    .card { background: var(--card); border: 1px solid var(--border);
            border-radius: var(--radius); padding: var(--s4) var(--s4) var(--s3); }
    .stat { font-size: 1.75rem; font-weight: 700; line-height: 1.15;
            font-variant-numeric: tabular-nums; margin-bottom: var(--s1); }

    .banner { display: flex; gap: var(--s4); align-items: center; justify-content: space-between;
              flex-wrap: wrap; background: var(--card); border: 1px solid var(--border);
              border-left-width: 4px; border-radius: var(--radius);
              padding: var(--s4); margin-bottom: var(--s4); }
    .banner-ok { border-left-color: #0b7a0b; }
    .banner-bad { border-left-color: var(--danger); }
    .banner .muted { margin-top: var(--s1); }

    /* --- filters & charts --- */
    .filters { display: flex; gap: var(--s3); flex-wrap: wrap; margin-bottom: var(--s5); }
    .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px;
           overflow: hidden; background: var(--card); }
    .seg a { padding: var(--s2) var(--s4); text-decoration: none; color: var(--ink-2);
             font-size: .92rem; border-right: 1px solid var(--border); line-height: 1.3; }
    .seg a:last-child { border-right: none; }
    .seg a:hover { background: var(--hover); color: var(--ink); }
    .seg a.active { background: var(--border); color: var(--ink); font-weight: 600; }

    .chart-card { padding: var(--s4); margin-bottom: var(--s4); }
    .chart-scroll { overflow-x: auto; }
    .legend { display: flex; gap: var(--s5); align-items: center; flex-wrap: wrap;
              margin-bottom: var(--s3); font-size: .92rem; }
    .legend svg { vertical-align: -2px; margin-right: var(--s1); }
    svg .axis { stroke: var(--ink-2); stroke-width: 1; }
    svg .grid { stroke: var(--border); stroke-width: 1; }
    svg .tick { fill: var(--ink-2); font-size: 11px; font-family: system-ui, sans-serif; }
    svg a rect:hover { opacity: .85; }

    .pagination { display: flex; align-items: center; gap: var(--s3); flex-wrap: wrap;
                  margin-top: var(--s3); }
    .pagination .spacer { flex: 1; }
    .pagebtn { padding: var(--s2) var(--s4); border: 1px solid var(--border);
               border-radius: 7px; text-decoration: none; color: var(--ink);
               background: var(--card); font-size: .92rem; }
    .pagebtn:hover { border-color: var(--ink-2); }
    .pagebtn.disabled { opacity: .4; }

    details { margin-top: var(--s4); }
    details summary { cursor: pointer; padding: var(--s2) 0; }
    details > .table-wrap { margin-top: var(--s3); }

    @media (max-width: 40rem) {
      main { padding: var(--s4) var(--s4) 3rem; }
      nav { padding: var(--s2) var(--s4); }
      nav .who { display: none; }
    }
  </style>
</head>
<body>
  <nav>
    <span class="brand">dmarc-service</span>
    <a href="/" class="{{ 'active' if request.url.path == '/' }}">Overview</a>
    <a href="/reports" class="{{ 'active' if request.url.path.startswith('/reports') }}">Reports</a>
    <a href="/graphs" class="{{ 'active' if request.url.path.startswith('/graphs') }}">Graphs</a>
    <a href="/upload" class="{{ 'active' if request.url.path.startswith('/upload') }}">Upload</a>
    <a href="/tenants" class="{{ 'active' if request.url.path.startswith('/tenants') }}">Tenants &amp; domains</a>
    <a href="/docs" target="_blank" rel="noopener">API </a>
    {% if user.is_admin %}
    <a href="/settings" class="{{ 'active' if request.url.path.startswith('/settings') }}">Settings</a>
    {% endif %}
    <span class="spacer"></span>
    <span class="who">{{ report_host }}</span>
    <a href="/profile" class="{{ 'active' if request.url.path.startswith('/profile') }}">{{ user.email }}</a>
    <form class="inline" method="post" action="/logout"><button>Log out</button></form>
  </nav>
  <main>
  {% block content %}{% endblock %}
  </main>
</body>
</html>
