<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Setup — dmarc-service</title>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: system-ui, sans-serif; display: grid; place-items: center; min-height: 90vh; }
    form { display: grid; gap: .8rem; min-width: 20rem; }
    input, button { padding: .5rem .7rem; border: 1px solid #8886; border-radius: 6px; background: transparent; color: inherit; }
    .muted { opacity: .7; font-size: .9rem; }
    .error { color: #c33; font-size: .9rem; }
  </style>
</head>
<body>
  <form method="post" action="/setup">
    <h1>Welcome to dmarc-service</h1>
    <p class="muted">Create the first account. It becomes the administrator,
    which can configure SSO and manage everything else from the UI.</p>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <input type="email" name="email" placeholder="you@example.com" autofocus required>
    <input type="password" name="password" placeholder="Password (min 8 chars)" minlength="8" required>
    <button type="submit">Create admin account</button>
  </form>
</body>
</html>
