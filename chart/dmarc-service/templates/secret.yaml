{{- if include "dmarc-service.needsOwnSecret" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dmarc-service.fullname" . }}
  labels:
    {{- include "dmarc-service.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.database.url }}
  DATABASE_URL: {{ .Values.database.url | quote }}
  {{- end }}
  {{- if and .Values.auth.apiToken (not .Values.auth.existingSecret) }}
  API_TOKEN: {{ .Values.auth.apiToken | quote }}
  {{- end }}
  {{- if and .Values.auth.ingestToken (not .Values.auth.existingSecret) }}
  INGEST_TOKEN: {{ .Values.auth.ingestToken | quote }}
  {{- end }}
  {{- if and .Values.auth.sessionSecret (not .Values.auth.existingSecret) }}
  SESSION_SECRET: {{ .Values.auth.sessionSecret | quote }}
  {{- end }}
  {{- if and .Values.backup.s3Url (not .Values.backup.existingSecret) }}
  BACKUP_S3_URL: {{ .Values.backup.s3Url | quote }}
  {{- end }}
{{- end }}
