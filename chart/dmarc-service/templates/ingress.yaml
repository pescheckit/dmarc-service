{{- if and .Values.web.enabled .Values.web.ingress.enabled }}
{{- $host := .Values.web.ingress.host | default .Values.reportHost }}
{{- $issuer := .Values.web.ingress.certManager.clusterIssuer }}
{{- $tlsSecret := .Values.web.ingress.tls.secretName | default (printf "%s-tls" (replace "." "-" $host)) }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "dmarc-service.fullname" . }}
  labels:
    {{- include "dmarc-service.labels" . | nindent 4 }}
  annotations:
    {{- if $issuer }}
    cert-manager.io/cluster-issuer: {{ $issuer }}
    {{- end }}
    {{- with .Values.web.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- with .Values.web.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if or .Values.web.ingress.tls.enabled $issuer }}
  tls:
    - hosts: [{{ $host | quote }}]
      secretName: {{ $tlsSecret }}
  {{- end }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "dmarc-service.fullname" . }}-web
                port:
                  name: http
{{- end }}
