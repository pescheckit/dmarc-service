image:
  repository: ghcr.io/pescheckit/dmarc-service
  tag: ""  # defaults to the chart appVersion
  pullPolicy: IfNotPresent
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

# Hostname report addresses live under (<random>@<reportHost>) and public
# base URL of the web app (used in generated TLS-RPT records).
reportHost: dmarc.example.com
externalUrl: https://dmarc.example.com

tenancy:
  mode: multi  # multi | single
controlPlane:
  enabled: true

# Database, in order of precedence:
# 1. existingSecret: read the URL from your own Secret (key: secretKey)
# 2. url: put the URL in plain values (chart renders its own Secret)
# 3. neither: SQLite on a PVC (enable persistence; single-replica installs
#    only, and smtp must run in forward mode or share the web pod's volume)
database:
  existingSecret: ""
  secretKey: DATABASE_URL
  url: ""

persistence:  # only used for the SQLite fallback
  enabled: false
  size: 1Gi
  storageClass: ""
  accessModes: [ReadWriteOnce]

auth:
  # Static bearer token for /api/* automation. Optional: users can also mint
  # personal API tokens in the UI (first account created becomes the admin,
  # which can configure OIDC SSO for everyone else).
  apiToken: ""
  # Token forward-mode edges use against /api/ingest (empty = endpoint off).
  ingestToken: ""
  # Cookie-signing key for UI sessions; empty = random per pod restart.
  sessionSecret: ""
  # Or bring your own Secret with keys API_TOKEN / INGEST_TOKEN / SESSION_SECRET.
  existingSecret: ""

web:
  enabled: true  # disable for an edge-only install (smtp.mode=forward)
  replicas: 1
  resources: {}
  extraEnv: []
  podAnnotations: {}
  service:
    type: ClusterIP
    port: 8000
  ingress:
    enabled: false
    className: ""  # e.g. nginx; left empty, no ingressClassName is set
    annotations: {}
    host: ""  # defaults to reportHost
    tls:
      enabled: false
      secretName: ""  # defaults to <host>-tls when cert-manager is used
    certManager:
      clusterIssuer: ""  # sets cert-manager.io/cluster-issuer when non-empty

smtp:
  enabled: true
  mode: direct  # direct (store to DB) | forward (relay to another instance)
  forward:
    url: ""  # e.g. https://dmarc.example.com/api/ingest
    # token defaults to auth.ingestToken / auth.existingSecret INGEST_TOKEN
  replicas: 1
  resources: {}
  extraEnv: []
  podAnnotations: {}
  maxMessageBytes: 52428800  # 50 MB; don't lower it much, see README
  service:
    type: LoadBalancer  # LoadBalancer | NodePort | ClusterIP
    port: 25
    nodePort: null  # set when type=NodePort and you need a fixed port
    annotations: {}  # cloud LB annotations (proxy protocol off! plain TCP)
    # Local preserves real sender IPs; requires the LB to health-check nodes.
    externalTrafficPolicy: Local
  tls:
    # Secret with tls.crt/tls.key to offer STARTTLS. Optional: inbound
    # report mail is opportunistic TLS; plaintext is accepted either way.
    existingSecret: ""

# Nightly database dump to any S3-compatible storage (Wasabi, AWS, Scaleway,
# MinIO, Backblaze). Aggregate reports cannot be re-fetched, so a lost
# database is history you cannot recover.
backup:
  enabled: false
  schedule: "20 3 * * *"
  retentionDays: 30
  # s3://<access-key>:<secret-key>@<endpoint-host>/<bucket>[/<prefix>]
  # percent-encode keys containing / or +
  s3Url: ""
  # or keep the URL in your own Secret
  existingSecret: ""
  secretKey: BACKUP_S3_URL
  resources: {}
  extraEnv: []

# Prometheus metrics, on a port of their own that no Ingress routes to.
# Treat these as sensitive: the labels name every tenant and domain, say
# which of them have no working DMARC record, and say which are near the SPF
# lookup limit. That is a target list for spoofing your tenants, so a token
# is required unless you state that the port is unreachable anyway.
metrics:
  enabled: false
  port: 9100
  token: ""  # scrapers send "Authorization: Bearer <token>"
  existingSecret: ""  # or bring your own Secret holding the token
  secretKey: METRICS_TOKEN
  allowUnauthenticated: false
  # false publishes only totals, with no tenant, domain or mailbox names,
  # for a Prometheus shared more widely than the data itself.
  labels: true
  dnsInterval: 900  # seconds between background DNS/SPF checks
  serviceMonitor:
    enabled: false  # needs prometheus-operator CRDs
    interval: 60s
    scrapeTimeout: 10s
    labels: {}  # e.g. release: kube-prometheus-stack, to be picked up
    namespace: ""  # defaults to the release namespace
  rules:
    enabled: false  # PrometheusRule with the alerts documented in the README
    labels: {}
    staleReportHours: 36  # senders report daily; silence means reports are lost
    spfLookupWarning: 8  # of the ten RFC 7208 permits
  networkPolicy:
    # Restrict the metrics port to the namespaces allowed to scrape it.
    enabled: false
    namespaceSelector: {}  # empty = the release namespace only

migrate:
  enabled: true  # pre-install/pre-upgrade Job running schema migrations

serviceAccount:
  create: false
  name: ""

nodeSelector: {}
tolerations: []
affinity: {}
