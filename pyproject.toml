[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dmarc-service"
version = "0.1.0"
description = "Self-hosted, multi-tenant DMARC / TLS-RPT report collector and viewer"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Pescheck" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "aiosmtpd>=1.4.6",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "jinja2>=3.1",
    "defusedxml>=0.7",
    "tldextract>=5.1",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "itsdangerous>=2.2",
    "python-multipart>=0.0.9",
    "argon2-cffi>=23.1",
    "authlib>=1.3",
    "dnspython>=2.6",
    "boto3>=1.34",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[project.scripts]
dmarc-service = "dmarc_service.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dmarc_service"]
artifacts = ["src/dmarc_service/api/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
