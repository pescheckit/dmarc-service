name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9
        with:
          # There is no lock file, so the cache key would never change and the
          # cache would never be invalidated; key it on the dependencies.
          cache-dependency-glob: pyproject.toml
      - run: uv venv && uv pip install -e '.[dev]'
      - run: .venv/bin/ruff check .
      - run: .venv/bin/pytest -q

  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - run: helm lint chart/dmarc-service
      - run: helm template chart/dmarc-service > /dev/null

  release:
    # Tag vX.Y.Z to publish the image and chart to GHCR.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, helm-lint]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - name: Resolve version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository }}:latest
      - uses: azure/setup-helm@v5
      - name: Push chart to GHCR (OCI)
        run: |
          helm package chart/dmarc-service \
            --version "${{ steps.version.outputs.version }}" \
            --app-version "${{ steps.version.outputs.version }}"
          helm push "dmarc-service-${{ steps.version.outputs.version }}.tgz" \
            "oci://ghcr.io/${{ github.repository_owner }}/charts"

  deploy:
    # Auto-deploys tagged releases to the VPS when the repo has DEPLOY_SSH_KEY
    # and DEPLOY_HOST secrets configured (fork-friendly: skipped otherwise).
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release]
    runs-on: ubuntu-latest
    steps:
      # The compose file and proxy config are copied to the host, so the
      # deploy job needs the repository too.
      - uses: actions/checkout@v7
      - name: Deploy over SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          if [ -z "$DEPLOY_SSH_KEY" ] || [ -z "$DEPLOY_HOST" ]; then
            echo "deploy secrets not configured; skipping"; exit 0
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          SSH="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new root@$DEPLOY_HOST"

          # The compose file and proxy config live in this repository, so a
          # deploy can change them without rebuilding the host.
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
            deploy/vps/docker-compose.yml deploy/vps/Caddyfile "root@$DEPLOY_HOST:/opt/dmarc/"

          # Boot-time unit must start the stack detached, otherwise a deploy
          # that recreates containers pulls the foreground unit down with it.
          $SSH 'cat > /etc/systemd/system/dmarc.service' <<"UNIT"
          [Unit]
          Description=dmarc-service stack (docker compose)
          After=docker.service
          Requires=docker.service

          [Service]
          Type=oneshot
          RemainAfterExit=yes
          WorkingDirectory=/opt/dmarc
          ExecStart=/usr/bin/docker compose up -d --remove-orphans --wait
          ExecStop=/usr/bin/docker compose down

          [Install]
          WantedBy=multi-user.target
          UNIT
          $SSH 'systemctl daemon-reload'

          $SSH 'set -e
            cd /opt/dmarc
            # Each release leaves the previous image behind, which fills a
            # small disk in a few dozen deploys, so reclaim before pulling.
            docker image prune -af --filter until=24h >/dev/null || true
            df -h / | tail -1

            docker compose pull --quiet
            docker compose run --rm --no-deps migrate

            # Recreate only the application containers and wait until they
            # report healthy. Postgres and the proxy keep running, and Caddy
            # retries during the swap, so requests are not dropped.
            docker compose up -d --no-deps --wait --wait-timeout 120 web smtp
            docker compose up -d --no-deps caddy postgres

            docker compose ps --format "{{.Name}}\t{{.Status}}"
            docker image prune -af --filter until=1h >/dev/null || true

            # The proxy answers for the new container, from the host itself.
            curl -fsS -o /dev/null -w "healthz via proxy: %{http_code}\n" \
              --resolve "$(hostname -f):443:127.0.0.1" https://localhost/healthz \
              --insecure || curl -fsS -o /dev/null -w "healthz direct: %{http_code}\n" \
              http://127.0.0.1:8000/healthz 2>/dev/null || true'
